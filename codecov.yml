# Codecov Configuration
# v2.30.0 Phase 3: CI/CD Integration

coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 5%
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 5%

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false

ignore:
  - "node_modules"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "src/test/**"
  - "**/*.d.ts"
  - "vite.config.ts"
  - "vitest.config.ts"
  - "tailwind.config.js"

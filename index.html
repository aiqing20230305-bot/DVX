<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI驱动的内容战略平台，助力品牌洞察、选题策划、脚本创作" />
    <title>超级洞察 · AI 内容战略平台</title>

    <!-- v2.12.0 Phase 1.2: Prevent FOUC - Set theme before first paint -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('ui-store')
          if (stored) {
            const state = JSON.parse(stored)
            const theme = state.state?.theme || 'dark'
            document.documentElement.setAttribute('data-theme', theme)
            document.documentElement.classList.toggle('dark', theme === 'dark')
          } else {
            // Default theme: dark
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          // Fallback to dark theme on error
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- v2.10.0 Phase 2: 首屏loading优化 - 内联关键CSS -->
    <style>
      /* Critical CSS - 首屏可见元素 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body, #root {
        height: 100%;
        background-color: #0A0A0A;
        color: #FAFAFA;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      /* Loading skeleton */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        background-color: #0A0A0A;
      }

      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(94, 106, 210, 0.1);
        border-top-color: #5E6AD2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        margin-top: 24px;
        font-size: 14px;
        color: #A0A0A0;
        font-weight: 400;
      }

      .loading-logo {
        margin-bottom: 32px;
        font-size: 32px;
        font-weight: 700;
        background: linear-gradient(135deg, #5E6AD2 0%, #06B6D4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Hide loading when React takes over */
      #root:not(:empty) + .app-loading,
      #root.loaded ~ .app-loading {
        display: none;
      }
    </style>

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!-- v2.10.0 Phase 2: Loading skeleton (在React加载前显示) -->
    <div class="app-loading" id="app-loading">
      <div class="loading-logo">超级洞察</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">AI内容战略平台加载中...</div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide loading skeleton when React mounts -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          const loading = document.getElementById('app-loading');
          if (root && root.innerHTML && loading) {
            loading.style.display = 'none';
          }
        });

        const root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }
      });
    </script>
  </body>
</html>

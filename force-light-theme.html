<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>强制切换到白色主题</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: #1a202c;
      margin-bottom: 16px;
    }
    p {
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      background: #5E6AD2;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms;
      display: inline-block;
      text-decoration: none;
    }
    .btn:hover {
      background: #4A55B8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(94, 106, 210, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .success {
      background: #10B981;
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
      display: none;
    }
    .success.show {
      display: block;
    }
    .success-text {
      color: white;
      font-weight: 600;
    }
    .code {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin: 24px 0;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 14px;
      color: #2d3748;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌞 强制切换到白色主题</h1>
    <p>检测到当前使用的是深色主题。点击下方按钮切换到白色主题，然后刷新页面即可看到效果。</p>

    <div class="code">
      当前主题：<span id="current-theme" style="font-weight: bold; color: #E53E3E;">dark</span>
    </div>

    <button class="btn" onclick="forceLightTheme()">切换到白色主题</button>

    <div class="success" id="success">
      <div class="success-text">✓ 已切换到白色主题！</div>
      <div style="color: rgba(255,255,255,0.9); margin-top: 8px; font-size: 14px;">
        请刷新页面查看效果（Cmd/Ctrl + R）
      </div>
    </div>

    <div style="margin-top: 32px;">
      <a href="http://localhost:5176" class="btn" style="background: #718096;">返回应用</a>
    </div>
  </div>

  <script>
    // 检查当前主题
    function checkCurrentTheme() {
      const stored = localStorage.getItem('ui-store')
      if (stored) {
        try {
          const data = JSON.parse(stored)
          const theme = data.state?.theme || 'dark'
          document.getElementById('current-theme').textContent = theme
          document.getElementById('current-theme').style.color = theme === 'dark' ? '#E53E3E' : '#10B981'
        } catch (e) {
          console.error('Failed to parse stored theme:', e)
        }
      }
    }

    // 强制设置为 light 主题
    function forceLightTheme() {
      // 方法1: 修改 ui-store
      const stored = localStorage.getItem('ui-store')
      if (stored) {
        try {
          const data = JSON.parse(stored)
          data.state.theme = 'light'
          localStorage.setItem('ui-store', JSON.stringify(data))
        } catch (e) {
          // 如果解析失败，直接创建新的
          localStorage.setItem('ui-store', JSON.stringify({
            state: {
              theme: 'light',
              sidebarCollapsed: false,
              activeStep: 'workbench'
            },
            version: 0
          }))
        }
      } else {
        // 如果不存在，创建新的
        localStorage.setItem('ui-store', JSON.stringify({
          state: {
            theme: 'light',
            sidebarCollapsed: false,
            activeStep: 'workbench'
          },
          version: 0
        }))
      }

      // 方法2: 直接设置 data-theme 属性
      document.documentElement.setAttribute('data-theme', 'light')
      document.documentElement.classList.remove('dark')

      // 显示成功消息
      document.getElementById('success').classList.add('show')

      // 更新显示的主题
      checkCurrentTheme()

      console.log('✓ 已强制切换到 light 主题')
      console.log('localStorage ui-store:', localStorage.getItem('ui-store'))
    }

    // 页面加载时检查
    checkCurrentTheme()
  </script>
</body>
</html>

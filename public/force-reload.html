<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>强制刷新</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { margin-bottom: 20px; color: #333; }
        .btn {
            background: #5E6AD2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover { background: #4A55B8; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔄 强制刷新页面</h1>
        <p>点击按钮清除缓存并重新加载</p>
        <button class="btn" onclick="forceReload()">强制刷新</button>
        <div id="status"></div>
    </div>

    <script>
        function forceReload() {
            const status = document.getElementById('status');
            status.className = 'status success';
            status.textContent = '✅ 正在清除缓存并刷新...';
            
            // 清除所有缓存
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            
            // 清除 localStorage
            localStorage.clear();
            sessionStorage.clear();
            
            setTimeout(() => {
                // 使用时间戳强制刷新
                window.location.href = '/?_=' + Date.now();
            }, 1000);
        }
    </script>
</body>
</html>
